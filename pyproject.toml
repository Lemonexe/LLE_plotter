[project]
name = "lle-plotter"
version = "2.0.0"
description = "GUI editor and ternary plotter for liquid-liquid equilibrium data"
requires-python = "==3.14.*"
dependencies = ["PySide6>=6.10,<7", "matplotlib>=3.10,<4", "mpltern>=1.0.4,<2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.16", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"

[tool.ruff]
line-length = 100


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
